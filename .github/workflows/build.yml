name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git python3 python3-dev python3-pip openjdk-11-jdk zip unzip wget curl libncurses5 libstdc++6 lib32stdc++6 lib32z1 zlib1g-dev

      - name: Install buildozer
        run: |
          pip3 install --user "cython==0.29.36"
          pip3 install --user buildozer
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Monkey patch urllib (redirect savannah to GitHub)
        run: |
          # 找到系统 Python 的 site-packages 目录
          SITE_PACKAGES=$(python3 -c "import site; print(site.getsitepackages()[0])")
          echo "site-packages: $SITE_PACKAGES"
          # 创建 sitecustomize.py，Python 启动时自动加载，全局拦截下载
          sudo tee "$SITE_PACKAGES/sitecustomize.py" > /dev/null << 'PYEOF'
          import urllib.request
          _orig_urlretrieve = urllib.request.urlretrieve
          def _patched_urlretrieve(url, *args, **kwargs):
              if 'savannah.gnu.org' in url and 'freetype' in url:
                  new_url = 'https://github.com/freetype/freetype/archive/refs/tags/VER-2-14-1.tar.gz'
                  print(f'[sitecustomize] Redirect freetype: {url} -> {new_url}')
                  url = new_url
              return _orig_urlretrieve(url, *args, **kwargs)
          urllib.request.urlretrieve = _patched_urlretrieve
          PYEOF
          # 验证 patch 已安装
          python3 -c "import urllib.request; print('urlretrieve:', urllib.request.urlretrieve)"

      - name: Build debug APK
        run: |
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: exifwatermark-apk
          path: bin/*.apk
