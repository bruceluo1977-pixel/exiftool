name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config libssl-dev python3-pip build-essential libffi-dev

      - name: Install buildozer
        run: |
          pip3 install --user "cython==0.29.36"
          pip3 install --user buildozer
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Clone and patch p4a (fix freetype download)
        run: |
          # 1. clone 到 home 目录，buildozer 不会覆盖这里
          cd ~
          git clone --depth 1 https://github.com/kivy/python-for-android.git p4a-patched
          cd p4a-patched
          # 2. 用 heredoc 创建 Python patch 脚本（单引号避免任何转义问题）
          cat > patch_freetype.py << 'PYEOF'
          recipe_path = 'pythonforandroid/recipes/freetype/__init__.py'
          with open(recipe_path, 'r') as f:
              content = f.read()

          # 替换下载地址（用字符串包含匹配，不依赖完整URL精确匹配）
          import re
          content = re.sub(
              r"url\s*=\s*'[^']*savannah[^']*'",
              "url = 'https://github.com/freetype/freetype/archive/refs/tags/VER-2-14-1.tar.gz'",
              content
          )

          # 添加 dir_name
          content = content.replace(
              "version = '2.14.1'",
              "version = '2.14.1'\n    dir_name = 'freetype-VER-2-14-1'"
          )

          with open(recipe_path, 'w') as f:
              f.write(content)

          # 验证
          print("=== patched freetype recipe ===")
          with open(recipe_path, 'r') as f:
              for i, line in enumerate(f, 1):
                  if 'url' in line or 'dir_name' in line:
                      print(f"{i}: {line.rstrip()}")
          PYEOF

          # 3. 运行 patch 脚本
          python3 patch_freetype.py

          # 4. 告诉 buildozer 用 patched p4a
          echo "p4a.source_dir = /home/runner/p4a-patched" >> $GITHUB_WORKSPACE/buildozer.spec
          echo "=== buildozer.spec p4a config ==="
          grep p4a $GITHUB_WORKSPACE/buildozer.spec
   
      - name: Build debug APK
        run: |
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: myapp-apk
          path: bin/*.apk
