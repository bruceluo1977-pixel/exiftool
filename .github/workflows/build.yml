name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git python3 python3-dev python3-pip openjdk-11-jdk zip unzip wget curl libncurses5 libstdc++6 lib32stdc++6 lib32z1 zlib1g-dev

      - name: Install buildozer
        run: |
          pip3 install --user "cython==0.29.36"
          pip3 install --user buildozer
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Clone p4a and patch freetype URL
        run: |
          mkdir -p buildozer/android/platform
          cd buildozer/android/platform
          git clone --depth 1 https://github.com/kivy/python-for-android.git
          cd python-for-android
          # 用 heredoc 创建 Python patch 脚本，正则替换 URL，不依赖精确匹配
          cat > patch_freetype.py << 'PYEOF'
          import re
          f = 'pythonforandroid/recipes/freetype/__init__.py'
          with open(f) as fh:
              c = fh.read()
          # 正则匹配任意 url = '...' 行，替换为 GitHub 镜像
          c = re.sub(r"url\s*=\s*'[^']*'",
              "url = 'https://github.com/freetype/freetype/archive/refs/tags/VER-2-14-1.tar.gz'",
              c, count=1)
          # 添加 dir_name，匹配 GitHub archive 解压后的目录名
          c = c.replace("version = '2.14.1'",
              "version = '2.14.1'\n    dir_name = 'freetype-VER-2-14-1'")
          with open(f, 'w') as fh:
              fh.write(c)
          # 验证
          print("=== patched freetype recipe ===")
          with open(f) as fh:
              for i, line in enumerate(fh, 1):
                  if 'url' in line or 'dir_name' in line:
                      print(f"{i}: {line.rstrip()}")
          PYEOF
          python3 patch_freetype.py

      - name: Build debug APK
        run: |
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: exifwatermark-apk
          path: bin/*.apk
