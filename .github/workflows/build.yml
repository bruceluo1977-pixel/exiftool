name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git python3 python3-dev python3-pip openjdk-11-jdk zip unzip wget curl libncurses5 libstdc++6 lib32stdc++6 lib32z1 zlib1g-dev

      - name: Install buildozer
        run: |
          pip3 install --user "cython==0.29.36"
          pip3 install --user buildozer
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Monkey patch urllib (patch urlopen, redirect savannah to GitHub)
        run: |
          SITE_PACKAGES=$(python3 -c "import site; print(site.getsitepackages()[0])")
          echo "site-packages: $SITE_PACKAGES"
          sudo tee "$SITE_PACKAGES/sitecustomize.py" > /dev/null << 'PYEOF'
          import urllib.request
          from urllib.request import Request

          _orig_urlopen = urllib.request.urlopen

          def _patched_urlopen(url, *args, **kwargs):
              # 处理 url 可能是 Request 对象或字符串
              if isinstance(url, Request):
                  url_str = url.full_url
              else:
                  url_str = str(url)
              # 拦截 freetype 从 savannah 的下载，重定向到 GitHub
              if 'savannah.gnu.org' in url_str and 'freetype' in url_str:
                  new_url = 'https://github.com/freetype/freetype/archive/refs/tags/VER-2-14-1.tar.gz'
                  print(f'[sitecustomize] Redirect freetype download:')
                  print(f'  from: {url_str}')
                  print(f'  to:   {new_url}')
                  if isinstance(url, Request):
                      url = Request(new_url, data=url.data, headers=url.headers, method=url.method)
                  else:
                      url = new_url
              return _orig_urlopen(url, *args, **kwargs)

          urllib.request.urlopen = _patched_urlopen
          print('[sitecustomize] urlopen patched successfully')
          PYEOF
          # 验证 patch 生效
          echo "=== 验证 sitecustomize ==="
          python3 -c "import urllib.request; print('urlopen:', urllib.request.urlopen)"
          python3 -c "
          from urllib.request import urlretrieve
          import inspect
          src = inspect.getsource(urlretrieve)
          print('urlretrieve 内部调用 urlopen，会被 patch 拦截')
          "

      - name: Build debug APK
        run: |
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: exifwatermark-apk
          path: bin/*.apk
