name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config libssl-dev python3-pip build-essential libffi-dev

      - name: Install buildozer
        run: |
          pip3 install --user "cython==0.29.36"
          pip3 install --user buildozer
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Pre-download freetype to p4a cache
        run: |
          # 1. 创建 p4a 的 packages 缓存目录
          mkdir -p /home/runner/.buildozer/android/packages
          cd /tmp

          # 2. 从 GitHub 官方镜像下载（用 curl，比 wget 可靠）
          curl -sL "https://github.com/freetype/freetype/archive/refs/tags/VER-2-14-1.tar.gz" -o freetype-raw.tar.gz
          ls -lh freetype-raw.tar.gz

          # 3. 解压（GitHub archive 解压后目录名是 freetype-VER-2-14-1）
          tar xzf freetype-raw.tar.gz
          ls -d freetype-VER-2-14-1

          # 4. 重命名为 p4a 期望的目录名 freetype-2.14.1，再重新打包
          mv freetype-VER-2-14-1 freetype-2.14.1
          tar czf /home/runner/.buildozer/android/packages/freetype-2.14.1.tar.gz freetype-2.14.1

          # 5. 验证：文件存在 + 包内目录名正确
          ls -lh /home/runner/.buildozer/android/packages/freetype-2.14.1.tar.gz
          echo "=== tar 包内前5个条目 ==="
          tar tzf /home/runner/.buildozer/android/packages/freetype-2.14.1.tar.gz | head -5

  
      - name: Build debug APK
        run: |
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: myapp-apk
          path: bin/*.apk
