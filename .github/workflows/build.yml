name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config libssl-dev python3-pip build-essential libffi-dev

      - name: Install buildozer
        run: |
          pip3 install --user "cython==0.29.36"
          pip3 install --user buildozer
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Pre-download freetype source
        run: |
          cd /tmp
          curl -sL "https://github.com/freetype/freetype/archive/refs/tags/VER-2-14-1.tar.gz" -o freetype-raw.tar.gz
          tar xzf freetype-raw.tar.gz
          # 重命名后放到 home 目录
          mv freetype-VER-2-14-1 /home/runner/freetype-src
          # 验证源码完整（能看到 configure 脚本）
          ls -la /home/runner/freetype-src/configure
        

  
      - name: Build debug APK
        env:
          P4A_FREETYPE_DIR: /home/runner/freetype-src
        run: |
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: myapp-apk
          path: bin/*.apk
