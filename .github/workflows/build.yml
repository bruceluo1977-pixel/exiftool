name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config libssl-dev python3-pip build-essential libffi-dev

      - name: Install buildozer
        run: |
          pip3 install --user "cython==0.29.36"
          pip3 install --user buildozer
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Clone and patch p4a (fix freetype download)
        run: |
          # 1. clone 到 home 目录，buildozer 不会覆盖这里
          cd ~
          git clone --depth 1 https://github.com/kivy/python-for-android.git p4a-patched
          cd p4a-patched
          # 2. 替换 freetype 下载地址为 GitHub 官方镜像
          sed -i 's|https://download.savannah.gnu.org/releases/freetype/freetype-{version}.tar.gz|https://github.com/freetype/freetype/archive/refs/tags/VER-2-14-1.tar.gz|g' pythonforandroid/recipes/freetype/__init__.py
          # 3. 添加 dir_name，匹配 GitHub archive 解压后的目录名
          sed -i "s|version = '2.14.1'|version = '2.14.1'\n    dir_name = 'freetype-VER-2-14-1'|" pythonforandroid/recipes/freetype/__init__.py
          # 4. 验证修改成功
          echo "=== patched freetype recipe ==="
          grep -nE "url|dir_name" pythonforandroid/recipes/freetype/__init__.py
          # 5. 告诉 buildozer 用这个 patched 的 p4a（动态追加到 spec）
          echo "p4a.source_dir = /home/runner/p4a-patched" >> $GITHUB_WORKSPACE/buildozer.spec
          echo "=== buildozer.spec p4a config ==="
          grep p4a $GITHUB_WORKSPACE/buildozer.spec
   
      - name: Build debug APK
        run: |
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: myapp-apk
          path: bin/*.apk
