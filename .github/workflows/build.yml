name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config libssl-dev python3-pip build-essential libffi-dev

      - name: Install buildozer
        run: |
          pip3 install --user "cython==0.29.36"
          pip3 install --user buildozer
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Clone p4a and patch freetype recipe
        run: |
          mkdir -p buildozer/android/platform
          cd buildozer/android/platform
          git clone --depth 1 https://github.com/kivy/python-for-android.git
          cd python-for-android
          # 用 Python 脚本修改 freetype recipe：换下载源 + 修正目录名
          python3 -c "
          recipe = 'pythonforandroid/recipes/freetype/__init__.py'
          with open(recipe, 'r') as f:
              c = f.read()
          c = c.replace(
              \"url = 'https://download.savannah.gnu.org/releases/freetype/freetype-{version}.tar.gz'\",
              \"url = 'https://github.com/freetype/freetype/archive/refs/tags/VER-2-14-1.tar.gz'\"
          )
          c = c.replace(
              \"version = '2.14.1'\",
              \"version = '2.14.1'\n    dir_name = 'freetype-VER-2-14-1'\"
          )
          with open(recipe, 'w') as f:
              f.write(c)
          print('=== patched freetype recipe ===')
          with open(recipe, 'r') as f:
              for line in f:
                  if 'url' in line or 'version' in line or 'dir_name' in line:
                      print(line.rstrip())
   
      - name: Build debug APK
        run: |
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: myapp-apk
          path: bin/*.apk
