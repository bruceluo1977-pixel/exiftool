name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config libssl-dev python3-pip build-essential libffi-dev

      - name: Install buildozer
        run: |
          pip3 install --user "cython==0.29.36"
          pip3 install --user buildozer
          echo "$HOME/.local/bin" >> $GITHUB_PATH
      - name: Pre-download freetype (fix savannah.gnu.org timeout)
        run: |
          mkdir -p ~/.buildozer/android/packages
          cd /tmp
          # 从 GitHub 官方镜像下载（Actions 服务器访问 GitHub 最快）
          wget -q "https://github.com/freetype/freetype/archive/refs/tags/VER-2-14-1.tar.gz" -O freetype-raw.tar.gz
          # 解压后目录名是 freetype-VER-2-14-1，p4a 期望的是 freetype-2.14.1，重命名后重新打包
          tar xzf freetype-raw.tar.gz
          mv freetype-VER-2-14-1 freetype-2.14.1
          tar czf ~/.buildozer/android/packages/freetype-2.14.1.tar.gz freetype-2.14.1
          # 验证文件存在且大小正常
          ls -lh ~/.buildozer/android/packages/freetype-2.14.1.tar.gz
   
      - name: Build debug APK
        run: |
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: myapp-apk
          path: bin/*.apk
