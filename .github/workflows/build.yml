name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config libssl-dev python3-pip build-essential libffi-dev

      - name: Install buildozer
        run: |
          pip3 install --user "cython==0.29.36"
          pip3 install --user buildozer
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Pre-download freetype to p4a cache
        run: |
          # 1. p4a 期望的缓存目录是 packages/freetype/（多一层 freetype 子目录）
          mkdir -p /home/runner/.buildozer/android/packages/freetype
          cd /tmp
          # 2. 从 GitHub 官方镜像下载
          curl -sL "https://github.com/freetype/freetype/archive/refs/tags/VER-2-14-1.tar.gz" -o freetype-raw.tar.gz
          # 3. 解压、重命名目录、重新打包
          tar xzf freetype-raw.tar.gz
          mv freetype-VER-2-14-1 freetype-2.14.1
          tar czf freetype-2.14.1.tar.gz freetype-2.14.1
          # 4. 放到正确的缓存目录 packages/freetype/
          cp freetype-2.14.1.tar.gz /home/runner/.buildozer/android/packages/freetype/
          # 5. 关键：创建 .mark- 标记文件，否则 p4a 会删掉 tar.gz 重新下载
          touch /home/runner/.buildozer/android/packages/freetype/.mark-freetype-2.14.1.tar.gz
          # 6. 验证
          ls -la /home/runner/.buildozer/android/packages/freetype/
        

  
      - name: Build debug APK
        run: |
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: myapp-apk
          path: bin/*.apk
